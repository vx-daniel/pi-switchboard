name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # GitHub-hosted: no self-hosted runner is registered on this repository, so a `vps`-labelled job
    # queues forever (the first release run sat queued until it was cancelled).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
        env:
          VP_GIT_HOOKS: '0'

      # The same gate as CI and the pre-commit hook (scripts/gate.ts): nothing is published that
      # would not pass a pull request.
      - name: Gate (oxfmt + oxlint + type check + tests + build)
        run: pnpm run check:all

      - name: Verify package contents
        run: vp pm pack --json --pack-destination /tmp

      - name: Record the release tags
        run: git tag --list 'pi-switchboard-v*' | sort > "$RUNNER_TEMP/tags-before"

      - name: Release
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release tags the release commit in this checkout before it pushes, so a new tag
      # here is this run's release; none means the commits since the last one released nothing.
      - name: Find this run's release tag
        id: released
        run: |
          git tag --list 'pi-switchboard-v*' | sort > "$RUNNER_TEMP/tags-after"
          tag="$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after")"
          # One release per run: more than one new tag would be a bug, not two images to publish.
          if [ "$(printf '%s' "$tag" | grep -c .)" -gt 1 ]; then
            echo "::error::semantic-release created more than one tag: $(printf '%s' "$tag" | tr '\n' ' ')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The container image for the release (#60), built from its tag.
  image:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The pi package for the release (#59), on GitHub Packages' npm registry, built from its tag.
  package:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # The standalone binaries for the release (#61), uploaded to its GitHub release, built from its tag.
  binary:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/binary.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
