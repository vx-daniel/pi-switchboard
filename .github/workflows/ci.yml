# CI — the enforced quality gate.
#
# Runs the SAME gate as the local pre-commit hook (`check:all` = scripts/gate.ts: oxfmt → oxlint with
# the type check → vitest with coverage → fallow → the tsdown build → a smoke run of the built CLI),
# so "green" means one thing whether it ran on a machine or here. A commit made with `--no-verify`,
# or by someone without the hooks installed, is caught at
# the pull request instead of slipping into `dev`.
#
# Pull requests into `dev` (the integration branch) and `main` (the release branch) are gated, and so
# is every push to `dev`, so a merge result is checked too. Pushes to `main` are gated by the release
# workflow, which runs the same `check:all` before it publishes.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  # Required so `gate` still runs — and can satisfy a required status check — when a pull request
  # merges through a merge queue. Without it, enabling a merge queue would deadlock every merge.
  merge_group:

# A newer push to the same branch cancels an in-flight run — no point finishing stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate # this string is the required-status-check context; renaming it breaks the branch rule
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, pnpm and the frozen install (`vp install`, which fails when the lockfile and
      # package.json disagree). VP_GIT_HOOKS=0 keeps `prepare` (`vp config`) from installing hooks.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
        env:
          VP_GIT_HOOKS: '0'

      - name: Gate (oxfmt + oxlint + type check + tests + build)
        run: pnpm run check:all

  # The standalone binary (#61): compiled with Bun, then run against the fixtures (test/binary). Bun
  # is build-only (CONSTITUTION.md 3.5.0), so this is its own job, never part of `check:all` or the
  # pre-commit hook; the gate above stays Node-only.
  binary:
    name: binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
        env:
          VP_GIT_HOOKS: '0'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Build the binary and run it against the fixtures
        run: pnpm run test:binary
