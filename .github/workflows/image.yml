name: Image

# Builds the container image from a release tag and publishes it to GHCR for linux/amd64 and
# linux/arm64 (#60). The release workflow calls it for each new release; run it by hand to publish
# a release whose image is missing. A published tag is never overwritten.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, such as pi-switchboard-v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, such as pi-switchboard-v0.1.0
        required: true
        type: string

permissions:
  contents: read

# Two runs for one tag would both pass the overwrite check before either pushes.
concurrency:
  group: image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vx-daniel/pi-switchboard
      TAG: ${{ inputs.tag }}

    steps:
      - name: Read the version from the tag
        id: version
        run: |
          version="${TAG#pi-switchboard-v}"
          if [ "$version" = "$TAG" ] ||
            ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (pi-switchboard-v<version>)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The release commit sets package.json's version, so the two agree on every release tag.
      - name: Check the tag matches package.json
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$package_version" != "$VERSION" ]; then
            echo "::error::package.json at $TAG says $package_version, not $VERSION"
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only "not found" lets the build go ahead: any other failure to read the registry stops it,
      # so an outage or a permission problem cannot turn into an overwrite.
      - name: Refuse to overwrite a published tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if output="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error::$IMAGE:$VERSION is already published; a tag is never overwritten"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -qi 'not found'; then
            echo "::error::could not check $IMAGE:$VERSION: $output"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The checked-out tag, not the Git context of the commit that started the workflow.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=pi-switchboard
            org.opencontainers.image.description=A local OpenAI-compatible API for pi's models and logins
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.licenses=MIT
