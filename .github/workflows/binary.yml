name: Binary

# Cross-compiles the standalone binary (#61) from a release tag for linux-x64, linux-arm64,
# darwin-x64 and darwin-arm64 (`scripts/build-binary.ts --all`), runs each one on a native runner,
# and uploads the four files and their SHA256SUMS to that tag's GitHub release with a build
# provenance attestation. One Linux runner builds every target. Windows is not a target yet, and
# the macOS binaries are unsigned. The release workflow calls it for each new release; run it by
# hand with the tag to finish or redo a release's binaries. A tag from before the binary existed
# (0.3.0 and earlier, with no scripts/build-binary.ts) fails at once: its tree cannot build one.
#
# Run by hand with no tag, it builds and smoke-tests the branch it runs on, every target on its
# own platform, and uploads nothing: the way to check this workflow before a release.
#
# Retryable, never overwriting: the upload adds only the expected assets the release is missing.
# An asset already there is kept, and must be byte-identical to this build (the compile is
# deterministic for one tree and Bun version), or the run fails before uploading anything. When
# all five are already there, the run succeeds without uploading. SHA256SUMS goes up last.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, such as pi-switchboard-v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and upload, such as pi-switchboard-v0.4.0; empty to build and test this branch without uploading
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Two runs for one tag would both see an asset missing and both upload it.
concurrency:
  group: binary-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Before anything is checked out: the tag must name a release.
      - name: Check the release tag
        if: inputs.tag != ''
        run: |
          version="${TAG#pi-switchboard-v}"
          if [ "$version" = "$TAG" ] ||
            ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (pi-switchboard-v<version>)"
            exit 1
          fi

      - name: Check out the release tag, or this branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check that this tree can build the binary
        run: |
          if [ ! -f scripts/build-binary.ts ]; then
            echo "::error::${TAG:-This tree} predates the standalone binary (#61): it has no scripts/build-binary.ts, so it cannot build one. Binaries start with the first release after 0.3.0"
            exit 1
          fi

      # A release's version is its tag's; a build-only run's is package.json's.
      - name: Read the version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#pi-switchboard-v}"
          else
            version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Node, pnpm and the frozen install, as in CI.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
        env:
          VP_GIT_HOOKS: '0'

      # Bun is the compiler only (CONSTITUTION.md 3.5.0): the same version CI tests the binary with.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # The release's tree is tested as a binary before it is cross-compiled: the host build runs
      # against the fixtures (test/binary), then `--all` builds every target from the same tree.
      - name: Test the binary
        run: pnpm run test:binary

      - name: Cross-compile every target
        run: node scripts/build-binary.ts --all

      - name: Keep the binaries for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            dist-bin/pi-switchboard-*
            dist-bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # Each target runs on its own platform before anything is uploaded: `--version` must exit 0
  # and print the release's version.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
          # macos-13 is retired; macos-15-intel is GitHub's remaining x64 macOS image.
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      FILE: pi-switchboard-${{ matrix.target }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries

      - name: Run --version
        run: |
          chmod +x "$FILE"
          output="$(./"$FILE" --version)"
          if [ "$output" != "$VERSION" ]; then
            echo "::error::$FILE --version printed '$output', not '$VERSION'"
            exit 1
          fi
          echo "$FILE --version: $output"

  # A build-only run (no tag) stops after the smoke tests.
  release:
    if: inputs.tag != ''
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries

      - name: Check the binaries against SHA256SUMS
        run: sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pi-switchboard-*
            SHA256SUMS

      # Fails when the release does not exist. Every check runs before any upload, so a mismatch
      # leaves the release as it was.
      - name: Upload the missing assets
        run: |
          expected="pi-switchboard-linux-x64 pi-switchboard-linux-arm64 pi-switchboard-darwin-x64 pi-switchboard-darwin-arm64 SHA256SUMS"
          present="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=""
          mkdir -p .published
          for asset in $expected; do
            if printf '%s\n' "$present" | grep -Fxq "$asset"; then
              gh release download "$TAG" --pattern "$asset" --dir .published
              if ! cmp -s "$asset" ".published/$asset"; then
                echo "::error::$asset on $TAG differs from this build: the tree or the Bun version changed since it was uploaded, or Bun's output was not reproducible. An asset is never overwritten; delete $TAG's binary assets to rebuild them"
                exit 1
              fi
              echo "$asset: already on $TAG, identical"
            else
              missing="$missing $asset"
            fi
          done
          if [ -z "$missing" ]; then
            echo "$TAG already has every binary and SHA256SUMS"
            exit 0
          fi
          # SHA256SUMS is last in `expected`, so it goes up after the binaries it lists.
          for asset in $missing; do
            gh release upload "$TAG" "$asset"
          done
