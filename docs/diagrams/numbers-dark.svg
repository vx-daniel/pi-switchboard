          aria-labelledby="numbers-dark-title numbers-dark-desc" id="numbers-dark-root"
        >
          <title id="numbers-dark-title">Where the numbers come from</title>
          <desc id="numbers-dark-desc">
            Requests feed in-memory registries that the console reads live and the stats file stores
            every five seconds; provider answers feed quota and cooldowns; the console and the HTTP
            routes read the stats file and the quota.
          </desc>
