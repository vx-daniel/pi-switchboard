          aria-labelledby="routing-title routing-desc" id="routing-root"
        >
          <title id="routing-title">How routing picks a model and login</title>
          <desc id="routing-desc">
            Routing walks the candidates in order, skipping one that is cooling down or below its
            quota reserve while another can serve, calling the rest, and moving on after a failure
            whose class the alias or the logins fall back on.
          </desc>
