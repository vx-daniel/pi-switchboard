      <style>#routing-root { --color-paper: #e6e7ed;
        --color-ink: #343b58;
        --color-muted: #4c505e;
        --color-accent: #6f490e;
        --font-sans: 'Geist', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #routing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #routing-root .diagram-container { width: 100%;
        overflow-x: auto; }
      #routing-root .diagram-container { overflow-x: visible; }</style>
