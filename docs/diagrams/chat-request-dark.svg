        >
          <title id="chat-request-dark-title">A chat request, end to end</title>
          <desc id="chat-request-dark-desc">
            A chat request is checked and its route planned, or rejected, then each candidate is
            called through pi until one answers or a failure that moves on to no other candidate is
            answered.
          </desc>
