      <style>#chat-request-dark-root { --color-paper: #24283b;
        --color-ink: #c0caf5;
        --color-muted: #a9b1d6;
        --color-accent: #e0af68;
        --font-sans: 'Geist', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #chat-request-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #chat-request-dark-root .diagram-container { width: 100%;
        overflow-x: auto; }
      #chat-request-dark-root .diagram-container { overflow-x: visible; }</style>
